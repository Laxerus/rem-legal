name: Cloudflare Pages checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: legal-pages-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate static pages and dashboard proxy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check Pages Function syntax
        run: |
          node --input-type=module --check < functions/_shared/rembot-dashboard-proxy.js
          node --input-type=module --check < functions/manage/index.js
          node --input-type=module --check < 'functions/manage/[[path]].js'
      - name: Check legal pages
        run: node tools/legal-pages-selftest.mjs
      - name: Check Cloudflare dashboard proxy
        run: node tools/cloudflare-dashboard-proxy-selftest.mjs
